 return`<div class="sh">Your runs</div><div class="grp">${rs.length?rs.map(x=>`<button class="rw2 b" data-sheet="run" data-a="${x.id}"><span class="dy">${x.d.slice(5)}</span><span class="rt"><b>${x.km} km</b><small>Pace ${fP(x.min*60/x.km)}${x.src==2?' · Scan':x.src==1?' · Garmin':''}</small></span><span class="rr">${fS(x.min)}</span>${I('chev',16,2.2)}</button>`).join(''):'<div class="rw2"><span class="rt mut">No runs yet. Tap + to log your first one.</span></div>'}</div><div class="grid"><div class="card stat"><span>This week</span><b>${wk[7].toFixed(1)} km</b></div><div class="card stat"><span>All time</span><b>${Math.round(sum(S.runs))} km</b></div>${stile('Day streak','streak',streak())}<div class="card stat"><span>Longest run</span><b>${lg?lg+' km':'–'}</b></div></div>${rl?`<button class="card gc" data-sheet="term" data-a="goalcheck"><span class="lbl">Goal check ${I('info',13,2)}</span><div class="big" style="font-size:22px">${rl.t}</div><div class="mut">Goal ${fT(S.goal.min)} · estimate today ${fT(rl.pr)}</div></button>`:''}<div class="card"><span class="lbl">Distance per week</span><div class="cols">${wk.map((k,i)=>`<div class="${i==7?'n':''}" data-h="${Math.max(3,k/mx*100)}"></div>`).join('')}</div><div class="mut" style="margin-top:8px">${wk[7].toFixed(1)} km this week · best ${mx.toFixed(1)} km</div></div>${prCard()}${calCard()}`;
}

render();
</script></body></html>
