<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RunQuest"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5a1f'/%3E%3Cpath d='M36 10L18 36h12l-4 18 20-28H34z' fill='white'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="icon.png">
<title>RunQuest</title>
<style>
/* ---------- tokens ---------- */
:root{--bg:#f2f2f7;--card:#fff;--fg:#000;--mut:#6c6c70;--line:rgba(60,60,67,.14);--sep:rgba(120,120,128,.18);--acc:#ff5a1f;--acc2:#ffb020;--on:#1a1a1a;--navbg:rgba(255,255,255,.86);--r:20px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root[data-skin=mono]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--fg:#fff;--mut:#98989d;--line:rgba(84,84,88,.5);--navbg:rgba(28,28,30,.86)}}
/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;overflow-x:hidden}
body.lock{overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none;transition:transform .15s cubic-bezier(.32,.72,0,1),opacity .15s}
button:active{opacity:.72}
input{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;font-size:17px}
button:focus,input:focus{outline:none}body.kb :focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ic{display:block;flex:none}
/* ---------- layout ---------- */
main{width:100%;max-width:560px;margin:0 auto;padding:12px 16px 170px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 16px}
header h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
#v>*{animation:up .4s cubic-bezier(.32,.72,0,1) both}
#v>*:nth-child(2){animation-delay:.04s}#v>*:nth-child(3){animation-delay:.08s}#v>*:nth-child(4){animation-delay:.12s}#v>*:nth-child(5){animation-delay:.16s}
main.na *,main.na *::before{transition:none!important;animation:none!important}
/* ---------- type ---------- */
h2{margin:0 0 14px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.big{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:500;color:var(--mut)}
.lbl{display:block;margin-bottom:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.mut{font-size:14px;color:var(--mut)}
.sh{margin:24px 16px 8px;font-size:13px;font-weight:500;letter-spacing:.03em;text-transform:uppercase;color:var(--mut)}
.msg{margin:0 4px 12px;font-size:15px;color:var(--mut)}
.hp{white-space:pre-line;font-size:15px;line-height:1.55}
.tip{margin-top:8px;font-size:15px}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--sep);font-size:11px;font-weight:600;color:var(--mut);vertical-align:1px}
.row{display:flex;align-items:center;gap:10px;min-width:0}.row>.btn{flex:1}
/* ---------- surfaces ---------- */
.card{display:block;width:100%;margin-bottom:14px;padding:16px;background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.grp{margin-bottom:14px;background:var(--card);border-radius:16px;overflow:hidden}
.grpb{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;margin-bottom:14px;padding:10px 16px;background:var(--card);border-radius:16px}
.rw2{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 16px;text-align:left}
.rw2+.rw2::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.rw2.b:active{background:var(--sep)}.rw2.done{opacity:.5}.rw2.dng,.rw2.dng .rt{color:#ff3b30}
.rw2.col{flex-direction:column;align-items:stretch;gap:8px}.rw2.col .seg{margin:0}
.rw2 .rt{flex:1;display:flex;flex-direction:column;min-width:0}.rt b{font-weight:600}.rt small{font-size:14px;color:var(--mut)}
.rw2 .rr{display:flex;align-items:center;color:var(--mut)}
.rw2 .dy{flex:none;min-width:52px;font-size:13px;font-weight:600;color:var(--mut)}
.rw2 .ri{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:#fff}
.rw2 input{flex:1;min-width:0;min-height:0;padding:0;border:0;outline:0;background:none;text-align:right}
.rw2 input[type=date]{min-height:30px}
.rw2 u{text-decoration:none;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* ---------- controls ---------- */
.btn{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);font-size:17px;font-weight:600;text-align:center}
.btn:active,.chip:active,.pbtn:active{transform:scale(.97)}
.btn.ghost{background:var(--sep);color:var(--fg)}
.btn[disabled]{opacity:.4}.dngb{background:#ff3b30;color:#fff}
.chip{padding:8px 14px;background:var(--sep);border-radius:99px;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);color:var(--on)}
.seg{display:flex;gap:2px;margin-bottom:14px;padding:2px;background:var(--sep);border-radius:10px}
.seg button{flex:1;min-height:40px;padding:8px 4px;border-radius:8px;font-size:14px;font-weight:500;text-align:center;transition:background .25s,box-shadow .25s}
.seg button.on{background:#fff;color:#000;box-shadow:0 2px 6px rgba(0,0,0,.18);font-weight:600}
.sw{position:relative;flex:none;width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.32);transition:background .25s}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sw.on{background:#34c759}.sw.on i{transform:translateX(20px)}
.dayrow{display:flex;justify-content:space-between;margin:0 2px 14px}
.dayrow button{width:44px;height:44px;border-radius:50%;background:var(--sep);font-size:14px;font-weight:600;text-align:center}
.dayrow button.on{background:var(--acc);color:var(--on)}
.lnk{display:flex;align-items:center;padding:0 0 10px;color:var(--acc)}.lnk .ic{transform:rotate(180deg)}
/* ---------- hero, stats ---------- */
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border:0;box-shadow:0 14px 30px -16px var(--acc)}
.hero .lbl,.hero .mut{color:inherit;opacity:.8}
.hero .btn{background:rgba(255,255,255,.95);color:#111}.hero .btn.ghost{background:rgba(255,255,255,.22);color:inherit}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.cd b{font-size:26px;font-weight:700}
.hstats{display:flex;gap:12px;margin:18px 0 16px}.hstats div{flex:1}.hstats b{display:block;font-size:22px;font-weight:700}.hstats span{font-size:13px;opacity:.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.grid>.card{margin:0}
.stat span{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mut)}.stat b{display:block;margin-top:4px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.stp{display:flex;align-items:flex-start;gap:12px;margin:10px 0}.stp b{flex:none;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:var(--acc);color:var(--on);font-size:14px}.stp span{padding-top:2px}
.bar{height:6px;margin:12px 0 6px;background:var(--sep);border-radius:9px;overflow:hidden}
.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width 1s cubic-bezier(.32,.72,0,1)}
.cols{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:8px}
.cols div{flex:1;height:0;background:var(--sep);border-radius:6px 6px 3px 3px;transition:height 1s cubic-bezier(.32,.72,0,1)}.cols div.n{background:linear-gradient(180deg,var(--acc),var(--acc2))}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv b{font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:12px;text-align:center}.cal b{font-weight:500;color:var(--mut)}
.cal i{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--sep);font-style:normal;color:var(--mut)}
.cal i.hv{background:var(--acc);color:var(--on);font-weight:600}.cal i.td{box-shadow:inset 0 0 0 2px var(--acc)}
@supports (background:color-mix(in srgb,red 50%,blue)){.cal i.hv{background:color-mix(in srgb,var(--acc) calc(var(--a)*100%),transparent);color:var(--fg)}}
.shim{padding:14px;text-align:center;border-radius:14px;color:var(--mut);background:linear-gradient(90deg,var(--sep),transparent,var(--sep)) 0 0/200% 100%;animation:sh 1.2s linear infinite}
/* ---------- avatars, header ---------- */
.av{flex:none;display:grid;place-items:center;border-radius:50%;background:var(--c);color:#fff}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}.av.gd{box-shadow:0 0 14px #ffd24a}
.lvc{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 5px;background:var(--card);border-radius:99px;font-size:14px;font-weight:600}
.lvc .av{box-shadow:none}.lvc.rdy{box-shadow:0 0 14px rgba(255,200,60,.55)}
.prof{display:flex;align-items:center;gap:14px}.prof .pt{flex:1;display:flex;flex-direction:column}.prof .pt span{font-size:14px;color:var(--mut)}
.avg{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px}
.avb{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:var(--sep)}.avb.on{box-shadow:inset 0 0 0 2px var(--acc)}.avb.cl{background:var(--c)}
.lvn{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.04em;color:var(--acc)}.lvn.bump{animation:bm .5s}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.bdg div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;color:var(--mut);opacity:.5}.bdg div.on{opacity:1;color:var(--fg)}.bdg div.on .ic{color:var(--acc)}
.skin{display:block;padding:10px;border-radius:16px;background:var(--sep);transition:transform .15s,box-shadow .2s}.skin:active{transform:scale(.97)}
.skin i{display:block;height:44px;margin-bottom:8px;border-radius:10px;background:linear-gradient(135deg,var(--c),var(--c2)) 0 0/40% 100% no-repeat,var(--g)}
.skin b{display:block;font-size:14px;font-weight:600}.skin span{display:flex;align-items:center;gap:4px;min-height:16px;font-size:12px;color:var(--mut)}
.skin.on{box-shadow:inset 0 0 0 2px var(--acc)}.skin[data-lock]{opacity:.5}.skin.pr.on{box-shadow:inset 0 0 0 2px #ffd24a}
/* ---------- sheet, scan ---------- */
#sh{position:fixed;inset:0;z-index:120;pointer-events:none}
#sh .bd{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .35s}
#sh .sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--bgi,var(--bg));border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .5s cubic-bezier(.32,.72,0,1)}
#sh.o{pointer-events:auto}#sh.o .bd{opacity:1}#sh.o .sheet{transform:none}
.gr{flex:none;height:26px;display:grid;place-items:center;touch-action:none}.gr i{width:38px;height:5px;border-radius:9px;background:rgba(128,128,128,.45)}
.sb{overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.scanb{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);font-weight:600;cursor:pointer}.scanb.sec{background:var(--sep);color:var(--fg)}
.wl{padding:18px 8px 6px;text-align:center}.wl h2{margin:14px 0 4px;font-size:28px}.wl p{margin:0 0 18px;color:var(--mut)}
.wlb{display:grid;place-items:center;width:92px;height:92px;margin:0 auto;border-radius:24px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);box-shadow:0 14px 30px -10px var(--acc)}
.wh{font-size:28px}
.sb{scrollbar-width:none}.sb::-webkit-scrollbar{display:none}
.rw2 input[type=date]{background:transparent;color:inherit;text-align:right;-webkit-appearance:none;appearance:none}.rw2 input::-webkit-date-and-time-value{text-align:right}
.nt{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:260;display:flex;gap:12px;width:min(94vw,420px);margin:0 auto;padding:12px 14px;background:var(--navbg);color:var(--fg);border-radius:22px;box-shadow:0 16px 40px -12px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);transform:translateY(-150%);transition:transform .5s cubic-bezier(.32,.72,0,1)}
.nt.in{transform:none}.ntb{flex:1;min-width:0}.nth{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}.nth span{font-size:13px;color:var(--mut)}
.ntl{font-size:15px;line-height:1.3}.ntl.m{margin-top:2px;color:var(--mut)}
.dn{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;line-height:1.15}.dn b{font-size:13px;font-weight:600;color:var(--mut)}.dn small{font-size:20px;font-weight:700;color:var(--fg)}
.dayr .rr{font-weight:600;color:var(--fg)}.dayr.td{background:var(--sep);box-shadow:inset 3px 0 0 var(--acc)}.dayr.rs{opacity:.55}.dayr.ok .rt b,.dayr.ok .rr{color:var(--acc)}
/* ---------- navigation ---------- */
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:90;display:flex;align-items:center;width:min(92vw,400px);margin:0 auto;padding:6px 8px;background:var(--navbg);border-radius:32px;box-shadow:0 20px 44px -14px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
nav .ng{flex:1;display:flex;justify-content:space-around;align-items:center;min-width:0}
nav .ng button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--mut)}
nav .ng button.on{color:var(--acc)}nav em{font-style:normal}
nav .fab{flex:none;display:grid;place-items:center;width:58px;height:58px;margin:-30px 6px 0;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);box-shadow:0 12px 26px -6px var(--acc);animation:pl 2.6s ease-in-out infinite}
/* ---------- overlays ---------- */
#ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fd .3s}
.pop{padding:20px;text-align:center;color:#fff;animation:pp .7s cubic-bezier(.2,1.4,.3,1) both}.pop .lvn{font-size:110px;font-weight:200;text-shadow:0 0 44px var(--acc)}
.rw{display:inline-block;margin:4px;padding:6px 14px;border-radius:99px;background:var(--c);color:#fff;font-size:13px;animation:up .6s .5s both}.rw .ic{display:inline-block;vertical-align:-2px;margin-right:4px}
.cf{position:fixed;top:-20px;z-index:120;width:8px;height:14px;pointer-events:none;animation:fall 2.4s ease-in forwards}
.xp{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:150;padding:10px 18px;border-radius:99px;background:rgba(28,28,30,.9);color:#fff;font-size:15px;font-weight:600;pointer-events:none;transform:translateX(-50%);animation:tp 1.6s cubic-bezier(.32,.72,0,1) forwards}
.sp{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 0 8px currentColor;animation:spk .85s ease-out forwards}
.rip{position:fixed;z-index:299;width:10px;height:10px;margin:-5px;border:2px solid var(--c);border-radius:50%;pointer-events:none;animation:rp .65s ease-out forwards}
.pbtn{position:relative;display:block;width:100%;padding:18px;overflow:hidden;border-radius:18px;background:linear-gradient(110deg,#b8860b,#ffd700 30%,#fff6c9 50%,#ffd700 70%,#b8860b) 0 0/250% 100%;color:#2a1c00;font-size:16px;font-weight:800;letter-spacing:.2em;text-align:center;box-shadow:0 0 22px rgba(255,200,60,.5);animation:shn 2.6s linear infinite,glow 2s ease-in-out infinite}
.pbtn::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0,rgba(255,255,255,.75) 10%,transparent 22%);animation:spn 3s linear infinite}
.pbtn span{position:relative}.pbtn .ic{display:inline-block;vertical-align:-3px;margin-right:6px}
#pv{position:fixed;inset:0;z-index:250;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a2a00,#000 70%);color:#fff6d6;text-align:center;animation:fd .4s}
.pfl{position:absolute;inset:0;background:#fff;pointer-events:none;animation:fl2 1.2s ease-out forwards}
.prg{position:absolute;left:50%;top:38%;width:20px;height:20px;margin:-10px;border:3px solid #ffd24a;border-radius:50%;opacity:0;animation:rg 2.4s ease-out infinite}.prg:nth-child(3){animation-delay:.8s}.prg:nth-child(4){animation-delay:1.6s}
.prain i{position:absolute;top:-30px;color:#ffd24a;font-style:normal;text-shadow:0 0 10px #ffb300;animation:rain linear infinite}
.pem{position:relative;color:#ffd24a;line-height:1;filter:drop-shadow(0 0 30px #ffb300);animation:pem 1.4s cubic-bezier(.2,1.4,.3,1) .3s both,flt 3s ease-in-out 1.8s infinite}
.ptt{position:relative;margin-top:14px;font-size:28px;font-weight:800;letter-spacing:.28em;background:linear-gradient(90deg,#b8860b,#fff6c9,#ffd700,#b8860b) 0 0/300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 3s linear infinite}.ptt span{display:inline-block;animation:up .5s both}
.psub{position:relative;margin:8px 0 18px;opacity:.8;animation:up .6s 1.9s both}.pks{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:440px}
.pk{width:92px;font-size:12px;animation:up .6s both}.pk i{display:block;height:46px;margin-bottom:6px;border-radius:12px;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 0 18px -2px var(--c)}
#pv .pbtn{animation:up .6s 3.4s both,shn 2.6s linear infinite,glow 2s ease-in-out infinite}
/* ---------- prestige skins ---------- */
:root[data-fx] .card,:root[data-fx] .grp{box-shadow:0 0 26px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.14)}
:root[data-fx] .btn,:root[data-fx] .chip.on,:root[data-fx] .scanb{background:linear-gradient(110deg,var(--acc2),var(--acc) 40%,#fff6c9 50%,var(--acc) 60%,var(--acc2)) 0 0/250% 100%;color:#2a1c00;border-color:transparent;animation:shn 3.2s linear infinite}
:root[data-fx] .btn.ghost{background:var(--sep);color:var(--fg);animation:none}
:root[data-fx] nav .fab{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#2a1c00;box-shadow:0 12px 28px -6px var(--acc),0 0 0 3px rgba(255,255,255,.25)}
:root[data-fx] .hero{background:linear-gradient(120deg,var(--acc2),#fff6c9 40%,var(--acc) 60%,var(--acc2)) 0 0/260% 260%;color:#2a1c00;animation:au 6s ease infinite}
:root[data-fx] .hero .btn{background:#2a1c00;color:var(--acc);animation:none}:root[data-fx] .hero .btn.ghost{background:rgba(42,28,0,.12);color:#2a1c00}
/* ---------- background layers ---------- */
